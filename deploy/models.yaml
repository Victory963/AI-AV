  # ------------------------------------------------------------------ 训练侧
  # 注意 dest 的根不是 ComfyUI/models 而是 train_root。两套目录故意分开：
  # 训练机和推理机常常不是同一台，混在一起同步时会把 30GB 的东西白传一遍。

  - id: musubi_train_deps
    purpose: "musubi-tuner 训练 Wan2.2 LoRA 需要的 VAE 与 T5。必须是 .pth 版本。"
    profiles: [train]
    license: apache-2.0
    files:
      - repo: Wan-AI/Wan2.1-I2V-14B-720P
        file: Wan2.1_VAE.pth
        dest: "@train:vae/Wan2.1_VAE.pth"
        size_bytes: 507609880
        verified: true
        note: "musubi docs/wan.md：Wan2.2_VAE.pth 与 14B 不兼容，训练一律用 2.1 这个"
      - repo: Wan-AI/Wan2.1-I2V-14B-720P
        file: models_t5_umt5-xxl-enc-bf16.pth
        dest: "@train:t5/models_t5_umt5-xxl-enc-bf16.pth"
        size_bytes: 11361920418
        verified: true
        note: "docs/wan.md：T5 与 2.1 相同；musubi 的 --t5 只吃这个 .pth"
      - repo: Wan-AI/Wan2.1-I2V-14B-720P
