        dest: models/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
        size_bytes: 14294742832
        verified: true
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
        dest: models/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
        size_bytes: 14294742832
        verified: true
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp16.safetensors
        dest: models/diffusion_models/wan2.2_i2v_high_noise_14B_fp16.safetensors
        size_bytes: 28577914792
        verified: true
        optional: true
        note: "fp16 原精度，单文件 28.6GB。只有 80GB 卡且做英雄镜时才值得"
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp16.safetensors
        dest: models/diffusion_models/wan2.2_i2v_low_noise_14B_fp16.safetensors
        size_bytes: 28577914792
        verified: true
        optional: true

  - id: wan22_t2v_a14b
    purpose: "T2V A14B。没有首帧可锁的空镜、环境镜走它。同样是高低噪成对。"
    profiles: [t2v, full]
    license: apache-2.0
    files:
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/diffusion_models/wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
        dest: models/diffusion_models/wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
        size_bytes: 14293923632
