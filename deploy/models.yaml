# longfilm 权重清单
#
# 这是 bootstrap_gpu.sh 与 train_lora_pod.sh 的唯一下载依据。
# 规则：
#   1. size_bytes 全部来自 HuggingFace 仓库 API（https://huggingface.co/api/models/<repo>?blobs=true）
#      的实测值，查证日期见 meta.verified_at。**写实测字节数而不是 "约 14GB"**，
#      因为 bootstrap 的幂等判断就是拿本地文件大小跟它比 —— 写个约数等于关掉校验。
#   2. 查不到的一律 verified: false，并写清楚为什么查不到。下载器对 verified:false 的条目
#      只做「存在即跳过」的弱校验，并在日志里喊一声。
#   3. sha256 目前一律 unverified：HF 的 blobs API 返回的是 git-lfs oid（sha256 of file），
#      但对 <10MB 的非 LFS 文件返回的是 git blob sha1，两者混在一起比不了，
#      与其写一半不如不写。TODO(2026-09-20)：改用 `hf download` 自带的 etag 校验。
#
# 关键坑（musubi 训练 vs ComfyUI 推理用的不是同一套文件）：
#   - ComfyUI 推理：diffusion_models/ 下的 fp8_scaled safetensors + text_encoders/umt5 safetensors
#     + vae/wan2.2_vae.safetensors
#   - musubi-tuner 训练：DiT 用同一批 safetensors，但 VAE 必须用 **Wan2.1_VAE.pth**
#     （musubi docs/wan.md 明写 Wan2.2_VAE.pth 与 14B 不兼容），T5 必须用
#     **models_t5_umt5-xxl-enc-bf16.pth**（.safetensors 版本 musubi 不吃）。
#     这两条是踩过最多次的坑，所以分成两个 profile，不共用。

meta:
  schema_version: 1
  verified_at: "2026-09-20"
  verified_by: "HuggingFace models API (?blobs=true) 实测 size，license 取 cardData.license"
  sources:
    - "https://huggingface.co/api/models/Comfy-Org/Wan_2.2_ComfyUI_Repackaged"
    - "https://huggingface.co/api/models/Wan-AI/Wan2.1-I2V-14B-720P"
    - "https://huggingface.co/api/models/Wan-AI/Wan2.2-I2V-A14B"
    - "https://github.com/kohya-ss/musubi-tuner/blob/main/docs/wan.md"
  comfy_root: "/workspace/ComfyUI"
  train_root: "/workspace/models"
  # profile -> 用途。bootstrap_gpu.sh --profile 取这里的 key。
  profiles:
    minimal: "只下 5B ti2v + VAE + fp8 文本编码器，约 17GB，用于开机冒烟"
    i2v: "产线主力：Wan2.2 I2V A14B 双专家 + VAE + 文本编码器"
    t2v: "无首帧的空镜/环境镜用"
    train: "musubi-tuner LoRA 训练所需（注意 VAE/T5 用 .pth 版本）"
    full: "以上全部 + animate/s2v/fun-camera 扩展"

groups:

  - id: wan22_text_encoder
    purpose: "UMT5-XXL 文本编码器。所有 Wan2.x 工作流共用，不下它任何图都出不来。"
    profiles: [minimal, i2v, t2v, full]
    license: apache-2.0
    files:
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
        dest: models/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
        size_bytes: 6735906897
        verified: true
        note: "24GB 卡必须用 fp8 这版，fp16 那版光文本编码器就吃掉一半显存"
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/text_encoders/umt5_xxl_fp16.safetensors
        dest: models/text_encoders/umt5_xxl_fp16.safetensors
        size_bytes: 11366399385
        verified: true
        optional: true
        note: "≥48GB 卡可用；提示词长且语义细的镜头，fp16 文本编码器的差别看得出来"

  - id: wan22_vae
    purpose: "VAE。2.2 的 14B 系列在 ComfyUI 侧用 wan2.2_vae，5B ti2v 也用它。"
    profiles: [minimal, i2v, t2v, full]
    license: apache-2.0
    files:
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/vae/wan2.2_vae.safetensors
        dest: models/vae/wan2.2_vae.safetensors
        size_bytes: 1409400960
        verified: true
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/vae/wan_2.1_vae.safetensors
        dest: models/vae/wan_2.1_vae.safetensors
        size_bytes: 253815318
        verified: true
        note: "2.1 工作流与部分社区 14B 工作流要这个；253MB，顺手下了省得半夜缺件"

  - id: wan22_ti2v_5b
    purpose: "Wan2.2 TI2V 5B 单体模型。冒烟测试与预演镜（EngineHint.DRAFT）走它。"
    profiles: [minimal, full]
    license: apache-2.0
    files:
      - repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
        file: split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors
        dest: models/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors
        size_bytes: 9999658848
        verified: true
        note: "单文件、无高低噪双专家，16GB 卡也能跑；画质不是天花板但够看构图"

  - id: wan22_i2v_a14b
    purpose: "产线主力 I2V。高噪/低噪两个专家必须成对，缺一个 ComfyUI 会在采样中途报错。"
