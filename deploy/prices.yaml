# longfilm 成本模型价目表
#
# cost_calculator.py 的唯一数据源。价格会变，代码不该跟着改 —— 所以全部外置在这里，
# 每条都带 verified/source/verified_at。
#
# 三类数据的可信度完全不同，别混着看：
#   verified: true   —— 今天亲自打开官方价目页核对过
#   verified: false  —— 只有二手来源（测评站/聚合站），当量级看，排期前必须复核
#   estimate: true   —— 没有公开基准，是按硬件规格外推的量级估计，**必须用一次实测校准**
#
# 已知的口径陷阱：
#   - RunPod 的 Community / Secure 是两条不同的可用性曲线，价差近 2 倍。长片批量渲染
#     可以吃 Community（断了重排队就行），LoRA 训练别吃（断在 80% 等于白烧）。
#   - Serverless 按「活跃 worker 秒」计费，冷启动拉 30GB 权重那段也算钱，
#     所以 serverless 的实际单价要按 cold_start_overhead_s 往上抬，见 calculator 里的处理。
#   - 各家 API 的「每秒」定义不含排队与重试。重拍率是成本模型里最大的单一变量，
#     不是小数点后的修正项。

meta:
  schema_version: 1
  verified_at: "2026-09-20"
  currency: USD
  fx:
    usd_cny: 6.70
    verified: true
    verified_at: "2026-09-18"
    source: "https://tradingeconomics.com/china/currency （2026-09-18 收 6.6971）"
    note: "人民币计价的国内 API（火山方舟/百炼）按这个折算成 USD 好横向比"
  sources:
    runpod: "https://www.runpod.io/pricing"
    vast: "https://vast.ai/pricing/gpu/RTX-4090 与 https://computecomparison.com/provider/vast-ai"
    paperspace: "https://docs.digitalocean.com/products/paperspace/pricing/ （2026-09-20 核对）"
    ark_token_formula: "src/longfilm/providers/ark_seedance.py（队友 2026-09-19 查证）"

