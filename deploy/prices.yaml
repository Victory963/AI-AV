# 订阅费。为什么单列：Paperspace 的高端卡要先买 Growth 订阅才解锁，
# 这笔钱与用量无关，按月固定 —— 只训一个 LoRA 时它能占总成本的一半。
subscriptions:
  paperspace_growth:
    usd_per_month: 39.0
    unlocks: ["RTX_A5000", "RTX_A6000", "A100_SXM", "V100"]
    verified: true
    source: "https://docs.digitalocean.com/products/paperspace/pricing/"
    note: "A4000/RTX5000 只要 Pro（$8/月），M4000/P4000/RTX4000 免费层可用"
  paperspace_pro:
    usd_per_month: 8.0
    unlocks: ["RTX_A4000"]
    verified: false

storage_usd_per_gb_month:
  container_disk: 0.10
  volume_running: 0.10
  volume_idle: 0.20
  network_standard: 0.07
  network_over_1tb: 0.05
  network_high_perf: 0.14
  verified: true
  source: "https://www.runpod.io/pricing"

# 自建路线的固定开销。为什么单列：这些钱跟出片量无关，是「开一次机就要付」的，
# 小批量时它们能占到总成本的一半以上，被折进每秒单价就看不见了。
selfhost_overheads:
  model_disk_gb: 120
  model_disk_note: "i2v profile 约 36GB，full 约 130GB；120 取中位，按 network_standard 计月费"
  cold_download_minutes: 25
  cold_download_note: "HF 拉 36GB，实测带宽差异极大；25 分钟是 200Mbps 的量级"
  warmup_minutes_per_session: 8
  warmup_note: "起 ComfyUI + 加载双专家权重进显存；每次开机付一次"
  failed_shot_gpu_ratio: 0.55
  failed_shot_note: "被 QC 打回的镜头平均烧掉成功镜头 55% 的机时（OOM/崩在中途的占比）"

# ------------------------------------------------------------------ 推理吞吐

# H100 基准：生成 1 秒成品视频要烧多少秒 GPU。其余卡按 gpus[].rel_throughput 线性换算。
# TODO(2026-09-20)：未检索到 Wan2.2 A14B 在 ComfyUI 下的公开吞吐基准。
# 这里是按「双专家各跑一半步数、14B fp8、A100/H100 公开算力规格」外推的量级估计。
# 上线前必须跑一次 `deploy/bootstrap_gpu.sh --smoke` 记录真实耗时，用 --calibrate 覆盖。
# 已实测一档：showreel_5b_720p_30step（2026-09-24，RTX 3090）。其余仍是外推估计。
presets:
  - key: hero_720p_20step
    label: "英雄镜 720p / A14B 双专家 / 20 步"
    resolution: [1280, 720]
    fps: 24
    h100_gpu_seconds_per_output_second_low: 55.0
    h100_gpu_seconds_per_output_second_high: 95.0
    min_vram_gb: 24
    estimate: true
  - key: normal_720p_12step
    label: "常规镜 720p / A14B / 12 步"
    resolution: [1280, 720]
    fps: 24
    h100_gpu_seconds_per_output_second_low: 33.0
    h100_gpu_seconds_per_output_second_high: 60.0
    min_vram_gb: 24
    estimate: true
  - key: draft_480p_4step
    label: "草片 480p / A14B + LightX2V 4 步蒸馏"
    resolution: [832, 480]
    fps: 16
    h100_gpu_seconds_per_output_second_low: 4.5
    h100_gpu_seconds_per_output_second_high: 9.0
    min_vram_gb: 24
    estimate: true
  # 本项目唯一实测过的一档：2026-09-24 在 RunPod 的 RTX 3090 上出三条样片记下来的。
  # 三次运行：81帧/3.38s 成品→373s、81帧/3.38s→394s、61帧/2.54s→266s，
  # 即 105~117 GPU 秒每成品秒。H100 两列是按 gpus[].rel_throughput=0.18 线性折算的，
  # **那个比值本身仍是估计**，没在 H100 上实测过。
  - key: showreel_5b_720p_30step
    label: "样片 720p / TI2V-5B 单体 / 30 步（实测）"
    resolution: [1280, 704]
    fps: 24
    h100_gpu_seconds_per_output_second_low: 18.8
    h100_gpu_seconds_per_output_second_high: 21.0
    min_vram_gb: 24
    estimate: false
    measured_on: "RTX 3090 24GB / RunPod community / ComfyUI 0.30.0"
    measured_date: "2026-09-24"
    measured_gpu_seconds_per_output_second_low: 104.7
    measured_gpu_seconds_per_output_second_high: 116.7
    measured_usd_per_output_second: 0.0068

  - key: previz_5b_480p
    label: "预演 480p / TI2V-5B 单体"
    resolution: [832, 480]
    fps: 16
    h100_gpu_seconds_per_output_second_low: 3.0
    h100_gpu_seconds_per_output_second_high: 6.0
    min_vram_gb: 16
    estimate: true

