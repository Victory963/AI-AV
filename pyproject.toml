[project]
name = "longfilm"
version = "0.1.0"
description = "长时间 AI 数字人拍片系统 —— 分镜驱动的多引擎长片产线"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
providers = ["requests>=2.32"]
tts = ["edge-tts>=6.1"]
dev = ["pytest>=8.0"]

[project.scripts]
longfilm = "longfilm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
